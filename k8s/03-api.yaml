apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: reflex
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: 10.182.120.1:5000/reflex-api:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: pql-demo          # literal: el Service del paso 4
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: reflex-db
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reflex-db
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: reflex-db
                  key: POSTGRES_DB
          livenessProbe:              # ¿vive? si falla → MATA el pod
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:             # ¿puede atender? si falla → lo saca del Service
            httpGet:
              path: /api/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api                            # NO negociable: el nginx.conf dice http://api:8080
  namespace: reflex
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
