services:
  api:
    build: ./reflex/api
    env_file: .env
    depends_on:
      pql-demo:
        condition: service_healthy
  
  web:
    build: ./reflex/web
    env_file: .env
    ports:
      - "8080:80"
    depends_on:
      - api
  
  pql-demo:
    image: postgres:16
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s 

volumes:
  postgres_data: 